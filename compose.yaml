services:
  game-interface:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zombie-game-interface
    image: robinewest/zombie-interface:1.0.1
    ports:
      - "8081:8081"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - GAME_SERVICE_URL=http://zombie-game-service:8080
    stdin_open: true
    tty: true
    networks:
      - spring-network

networks:
  spring-network:
    name: spring-network
    external: true